<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1b1412">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Getränkekassa</title>
<style>
  :root{
    --bg:#1b1412; --panel:#2a201c; --panel2:#352823; --text:#fff7ee; --muted:#c9b8a8;
    --accent:#e0a526; --red:#c8402f; --green:#3fa34d; --blue:#2f6fb0; --line:#4a3a33;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
  button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
  button:active{transform:scale(.97);filter:brightness(1.15)}

  .app{display:grid;grid-template-columns:1.35fr 1fr;gap:10px;height:100%;padding:10px}
  .left{display:flex;flex-direction:column;gap:10px;min-height:0}
  .grid{flex:1;display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr;gap:10px;min-height:0}
  .tile{position:relative;border-radius:14px;padding:10px 12px;text-align:left;
    display:flex;flex-direction:column;justify-content:space-between;
    background:var(--panel2);border:2px solid transparent;min-height:0}
  .tile.on{border-color:var(--accent)}
  .tile .name{font-size:clamp(17px,2.4vw,26px);font-weight:700;line-height:1.1}
  .tile .price{font-size:clamp(14px,1.8vw,19px);color:var(--muted)}
  .tile .cnt{position:absolute;right:10px;top:8px;min-width:46px;height:46px;border-radius:23px;
    background:var(--accent);color:#1b1412;font-size:26px;font-weight:800;
    display:none;align-items:center;justify-content:center;padding:0 8px}
  .tile.on .cnt{display:flex}
  .tile .minus{position:absolute;right:8px;bottom:8px;width:52px;height:44px;border-radius:10px;
    background:rgba(0,0,0,.35);font-size:30px;font-weight:700;display:none;line-height:44px;text-align:center}
  .tile.on .minus{display:block}

  .ret{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:14px;padding:8px 10px}
  .ret .lbl{flex:1;font-size:clamp(16px,2vw,22px);font-weight:700}
  .ret .lbl small{display:block;font-weight:400;color:var(--muted);font-size:14px}
  .ret button{width:64px;height:56px;border-radius:12px;font-size:30px;font-weight:800}
  .ret .rm{background:var(--panel2)} .ret .add{background:var(--blue)}
  .ret .num{min-width:44px;text-align:center;font-size:30px;font-weight:800}

  .right{display:flex;flex-direction:column;gap:10px;min-height:0}
  .head{display:flex;align-items:center;gap:10px}
  .head img{height:clamp(48px,11vh,72px);background:#fff;border-radius:10px;padding:4px 10px}
  .head .ttl{font-size:18px;font-weight:700;line-height:1.15}
  .head .ttl small{font-size:14px;font-weight:400;color:var(--muted)}
  .sum{background:var(--panel);border-radius:14px;padding:10px 14px}
  .row{display:flex;justify-content:space-between;font-size:17px;color:var(--muted);padding:1px 0}
  .total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);
    margin-top:6px;padding-top:6px}
  .total .t1{font-size:20px;font-weight:700}
  .total .t2{font-size:clamp(34px,5vw,52px);font-weight:800;color:var(--accent)}
  .total.payout .t2{color:#6fc3ff}

  .money{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .money button{height:clamp(46px,8vh,62px);border-radius:12px;background:var(--panel2);font-size:22px;font-weight:700}
  .money .exact{background:var(--green);grid-column:span 2}
  .money .clr{background:#5a4038}

  .change{background:var(--panel);border-radius:14px;padding:8px 14px;flex:1;
    display:flex;flex-direction:column;justify-content:center;min-height:0}
  .change .g{font-size:17px;color:var(--muted)}
  .change .c{font-size:clamp(30px,5vw,50px);font-weight:800}
  .change .c.ok{color:#7be08a} .change .c.miss{color:#ff8a7a}

  .bottom{display:grid;grid-template-columns:auto auto 1fr;gap:8px}
  .bottom button{height:clamp(54px,10vh,72px);border-radius:14px;font-size:22px;font-weight:800;padding:0 16px}
  .b-reset{background:#5a4038} .b-menu{background:var(--panel2);font-size:26px!important}
  .b-done{background:var(--green)}
  .b-done:disabled{opacity:.35}

  /* Modals */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:12px;z-index:10}
  .modal.open{display:flex}
  .box{background:var(--panel);border-radius:16px;padding:16px;width:min(720px,100%);max-height:100%;overflow:auto}
  .box h2{margin:0 0 10px;font-size:24px}
  .box table{width:100%;border-collapse:collapse;font-size:18px}
  .box td,.box th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
  .box td.r,.box th.r{text-align:right}
  .box .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .box .acts button{padding:12px 16px;border-radius:12px;background:var(--panel2);font-size:18px;font-weight:700}
  .box .acts .pri{background:var(--green)} .box .acts .dng{background:var(--red)}
  .box input{font:inherit;font-size:18px;background:var(--bg);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:8px;width:100%;user-select:text;-webkit-user-select:text}
  .box input[type=checkbox]{width:26px;height:26px}
  .note{color:var(--muted);font-size:15px;margin-top:8px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--green);color:#fff;
    padding:12px 22px;border-radius:12px;font-size:20px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
  .toast.show{opacity:1}

  @media (orientation:portrait){
    html,body{overflow:auto}
    .app{grid-template-columns:1fr;height:auto;min-height:100%}
    .grid{grid-auto-rows:110px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="left">
    <div class="grid" id="grid"></div>
    <div class="ret">
      <div class="lbl">Häferl zurück <small id="retInfo">Pfand wird abgezogen</small></div>
      <button class="rm" id="retMinus">−</button>
      <div class="num" id="retNum">0</div>
      <button class="add" id="retPlus">+</button>
    </div>
  </div>

  <div class="right">
    <div class="head">
      <img id="logo" src="logo.png" alt="" onerror="this.style.display='none'">
      <span class="ttl">Adventmarkt 2026<br><small>Getränkekassa</small></span>
    </div>
    <div class="sum">
      <div class="row"><span id="lDrinks">Getränke</span><span id="vDrinks">0,00 €</span></div>
      <div class="row"><span id="lPfand">+ Pfand</span><span id="vPfand">0,00 €</span></div>
      <div class="row"><span id="lRet">− Rückgabe</span><span id="vRet">0,00 €</span></div>
      <div class="total" id="totalBox"><span class="t1" id="tLabel">Zu zahlen</span><span class="t2" id="vTotal">0,00 €</span></div>
    </div>

    <div class="money" id="money">
      <button data-v="1">1 €</button><button data-v="2">2 €</button>
      <button data-v="5">5 €</button><button data-v="10">10 €</button>
      <button data-v="20">20 €</button><button data-v="50">50 €</button>
      <button class="exact" id="exact">Passt genau</button>
      <button class="clr" id="clrGiven" style="grid-column:span 2">Gegeben löschen</button>
    </div>

    <div class="change">
      <div class="g" id="givenTxt">Gegeben: –</div>
      <div class="c" id="changeTxt">&nbsp;</div>
    </div>

    <div class="bottom">
      <button class="b-menu" id="menuBtn" aria-label="Menü">☰</button>
      <button class="b-reset" id="resetBtn">Neu</button>
      <button class="b-done" id="doneBtn">Fertig ✓</button>
    </div>
  </div>
</div>

<!-- Menü / Statistik -->
<div class="modal" id="mStats"><div class="box">
  <h2>Tagesstatistik</h2>
  <div id="statsBody"></div>
  <div class="acts">
    <button class="pri" data-close>Schließen</button>
    <button id="undoBtn">Letzte Buchung stornieren</button>
    <button id="openSettings">Preise ändern</button>
    <button class="dng" id="clearDay">Tag zurücksetzen</button>
  </div>
</div></div>

<!-- Einstellungen -->
<div class="modal" id="mSettings"><div class="box">
  <h2>Preise &amp; Getränke</h2>
  <table><thead><tr><th>Getränk</th><th style="width:110px">Preis €</th><th style="width:70px">Pfand</th><th style="width:50px"></th></tr></thead>
    <tbody id="setRows"></tbody></table>
  <div class="acts"><button id="addItem">+ Getränk</button></div>
  <div style="margin-top:12px;display:flex;align-items:center;gap:10px;font-size:18px">
    Pfand pro Häferl (€): <input id="setPfand" type="number" step="0.5" min="0" style="width:110px">
  </div>
  <div class="note">Gespeichert wird nur auf diesem Tablet.</div>
  <div class="acts">
    <button class="pri" id="saveSettings">Speichern</button>
    <button data-close>Abbrechen</button>
    <button id="defaults">Standardpreise</button>
  </div>
</div></div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var DEFAULT = {
    pfand: 2,
    items: [
      {name:"Kinderpunsch", price:3, pfand:true},
      {name:"Limo, Mineral", price:3, pfand:true},
      {name:"Glühwein", price:4, pfand:true},
      {name:"Bier", price:4, pfand:true},
      {name:"Wein gespritzt", price:4, pfand:true},
      {name:"1/8 Wein rot oder weiß", price:4, pfand:true}
    ]
  };
  var K_CFG = "kassa.cfg.v1", K_SALES = "kassa.sales.v1";

  function load(k, d){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
  function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }

  var cfg = load(K_CFG, clone(DEFAULT));
  var sales = load(K_SALES, []);
  var counts = [], ret = 0, given = 0;

  var $ = function(id){ return document.getElementById(id); };
  function eur(v){
    var s = Math.abs(v).toFixed(2).replace(".", ",");
    return (v < 0 ? "−" : "") + s + " €";
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  function calc(){
    var drinks = 0, cups = 0, n = 0;
    cfg.items.forEach(function(it, i){
      var c = counts[i] || 0; n += c;
      drinks += c * it.price;
      if (it.pfand) cups += c;
    });
    var pf = cups * cfg.pfand, rv = ret * cfg.pfand;
    return {drinks:drinks, cups:cups, n:n, pfand:pf, ret:rv, total: Math.round((drinks + pf - rv)*100)/100};
  }

  function buildGrid(){
    var g = $("grid"); g.innerHTML = "";
    counts = cfg.items.map(function(){ return 0; });
    cfg.items.forEach(function(it, i){
      var b = document.createElement("button");
      b.className = "tile";
      b.innerHTML = '<span class="name">'+esc(it.name)+'</span>'+
        '<span class="price">'+eur(it.price)+(it.pfand ? ' + '+eur(cfg.pfand).replace(" €","")+' Pfand' : '')+'</span>'+
        '<span class="cnt"></span><span class="minus">−</span>';
      b.addEventListener("click", function(e){
        if (e.target.classList.contains("minus")) { counts[i] = Math.max(0, counts[i]-1); }
        else counts[i]++;
        render();
      });
      g.appendChild(b);
    });
    $("retInfo").textContent = "je " + eur(cfg.pfand) + " zurück";
  }

  function render(){
    var tiles = $("grid").children;
    cfg.items.forEach(function(it, i){
      tiles[i].classList.toggle("on", counts[i] > 0);
      tiles[i].querySelector(".cnt").textContent = counts[i];
    });
    $("retNum").textContent = ret;
    var r = calc();
    $("lDrinks").textContent = r.n + " Getränk" + (r.n === 1 ? "" : "e");
    $("vDrinks").textContent = eur(r.drinks);
    $("lPfand").textContent = "+ Pfand (" + r.cups + " Häferl)";
    $("vPfand").textContent = eur(r.pfand);
    $("lRet").textContent = "− Rückgabe (" + ret + " Häferl)";
    $("vRet").textContent = eur(-r.ret);

    var tb = $("totalBox");
    if (r.total < 0){ tb.classList.add("payout"); $("tLabel").textContent = "Auszahlen"; $("vTotal").textContent = eur(-r.total); }
    else { tb.classList.remove("payout"); $("tLabel").textContent = "Zu zahlen"; $("vTotal").textContent = eur(r.total); }

    var ct = $("changeTxt");
    ct.className = "c";
    if (given > 0){
      $("givenTxt").textContent = "Gegeben: " + eur(given);
      var diff = Math.round((given - Math.max(r.total,0))*100)/100;
      if (diff >= 0){ ct.textContent = "Rückgeld " + eur(diff); ct.classList.add("ok"); }
      else { ct.textContent = "Fehlt " + eur(-diff); ct.classList.add("miss"); }
    } else {
      $("givenTxt").textContent = "Gegeben: –";
      ct.innerHTML = r.total < 0 ? "Auszahlen " + eur(-r.total) : "&nbsp;";
    }
    $("doneBtn").disabled = (r.n === 0 && ret === 0);
  }

  function resetCurrent(){ counts = counts.map(function(){ return 0; }); ret = 0; given = 0; render(); }

  function toast(msg){
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("show"); }, 1400);
  }

  // Events
  $("retPlus").onclick = function(){ ret++; render(); };
  $("retMinus").onclick = function(){ ret = Math.max(0, ret-1); render(); };
  Array.prototype.forEach.call(document.querySelectorAll("#money [data-v]"), function(b){
    b.onclick = function(){ given += +b.getAttribute("data-v"); render(); };
  });
  $("exact").onclick = function(){ var t = calc().total; given = t > 0 ? t : 0; render(); };
  $("clrGiven").onclick = function(){ given = 0; render(); };
  $("resetBtn").onclick = resetCurrent;
  $("doneBtn").onclick = function(){
    var r = calc();
    if (r.n === 0 && ret === 0) return;
    var lines = [];
    cfg.items.forEach(function(it, i){ if (counts[i]) lines.push({name:it.name, price:it.price, n:counts[i], cups: it.pfand ? counts[i] : 0}); });
    sales.push({t: Date.now(), lines: lines, ret: ret, pfand: cfg.pfand, total: r.total});
    save(K_SALES, sales);
    resetCurrent();
    toast("Gebucht ✓");
  };

  // Modals
  function open(id){ $(id).classList.add("open"); }
  function closeAll(){ Array.prototype.forEach.call(document.querySelectorAll(".modal"), function(m){ m.classList.remove("open"); }); }
  Array.prototype.forEach.call(document.querySelectorAll("[data-close]"), function(b){ b.onclick = closeAll; });

  function renderStats(){
    var by = {}, order = [], cupsOut = 0, cupsBack = 0, drinkSum = 0, cash = 0;
    sales.forEach(function(s){
      s.lines.forEach(function(l){
        if (!by[l.name]){ by[l.name] = {n:0, sum:0}; order.push(l.name); }
        by[l.name].n += l.n; by[l.name].sum += l.n * l.price;
        drinkSum += l.n * l.price; cupsOut += l.cups;
      });
      cupsBack += s.ret; cash += s.total;
    });
    var h = '<table><thead><tr><th>Getränk</th><th class="r">Stück</th><th class="r">Umsatz</th></tr></thead><tbody>';
    order.forEach(function(n){ h += '<tr><td>'+esc(n)+'</td><td class="r">'+by[n].n+'</td><td class="r">'+eur(by[n].sum)+'</td></tr>'; });
    if (!order.length) h += '<tr><td colspan="3" style="color:var(--muted)">Noch keine Verkäufe</td></tr>';
    h += '<tr><th>Getränke gesamt</th><th></th><th class="r">'+eur(drinkSum)+'</th></tr></tbody></table>';
    h += '<table style="margin-top:12px"><tbody>'+
      '<tr><td>Häferl ausgegeben</td><td class="r">'+cupsOut+'</td></tr>'+
      '<tr><td>Häferl zurück</td><td class="r">'+cupsBack+'</td></tr>'+
      '<tr><td>Häferl noch draußen</td><td class="r">'+(cupsOut-cupsBack)+'</td></tr>'+
      '<tr><td>Pfand-Saldo (in der Kassa)</td><td class="r">'+eur(cash - drinkSum)+'</td></tr>'+
      '<tr><th>Soll in der Kassa (ohne Wechselgeld)</th><th class="r">'+eur(cash)+'</th></tr>'+
      '<tr><td>Buchungen</td><td class="r">'+sales.length+'</td></tr></tbody></table>';
    $("statsBody").innerHTML = h;
    $("undoBtn").disabled = !sales.length;
  }
  $("menuBtn").onclick = function(){ renderStats(); open("mStats"); };
  $("undoBtn").onclick = function(){
    if (!sales.length) return;
    var s = sales[sales.length-1];
    var desc = s.lines.map(function(l){ return l.n+"× "+l.name; }).join(", ") + (s.ret ? (s.lines.length?", ":"") + s.ret + " Häferl zurück" : "");
    if (confirm("Letzte Buchung stornieren?\n\n" + desc + "\nBetrag: " + eur(s.total))){
      sales.pop(); save(K_SALES, sales); renderStats(); toast("Storniert");
    }
  };
  $("clearDay").onclick = function(){
    if (confirm("Wirklich ALLE Verkäufe dieses Tablets löschen?\nDas kann nicht rückgängig gemacht werden.")){
      sales = []; save(K_SALES, sales); renderStats(); toast("Statistik geleert");
    }
  };

  // Settings
  function settingsRow(it){
    var tr = document.createElement("tr");
    tr.innerHTML = '<td><input class="sN"></td><td><input class="sP" type="number" step="0.1" min="0"></td>'+
      '<td><input class="sF" type="checkbox"></td><td><button style="background:var(--red);border-radius:8px;width:40px;height:40px;font-size:20px">✕</button></td>';
    tr.querySelector(".sN").value = it.name;
    tr.querySelector(".sP").value = it.price;
    tr.querySelector(".sF").checked = !!it.pfand;
    tr.querySelector("button").onclick = function(){ tr.remove(); };
    return tr;
  }
  function fillSettings(c){
    var tb = $("setRows"); tb.innerHTML = "";
    c.items.forEach(function(it){ tb.appendChild(settingsRow(it)); });
    $("setPfand").value = c.pfand;
  }
  $("openSettings").onclick = function(){ closeAll(); fillSettings(cfg); open("mSettings"); };
  $("addItem").onclick = function(){ $("setRows").appendChild(settingsRow({name:"", price:0, pfand:true})); };
  $("defaults").onclick = function(){ fillSettings(DEFAULT); };
  $("saveSettings").onclick = function(){
    var items = [];
    Array.prototype.forEach.call($("setRows").children, function(tr){
      var n = tr.querySelector(".sN").value.trim();
      var p = parseFloat(String(tr.querySelector(".sP").value).replace(",", "."));
      if (n && !isNaN(p)) items.push({name:n, price:p, pfand: tr.querySelector(".sF").checked});
    });
    var pf = parseFloat(String($("setPfand").value).replace(",", "."));
    if (!items.length){ alert("Mindestens ein Getränk eintragen."); return; }
    cfg = {pfand: isNaN(pf) ? 0 : pf, items: items};
    save(K_CFG, cfg);
    closeAll(); buildGrid(); resetCurrent(); toast("Gespeichert");
  };

  // Bildschirm wach halten (wo unterstützt)
  var lock = null;
  function keepAwake(){
    if (navigator.wakeLock && document.visibilityState === "visible"){
      navigator.wakeLock.request("screen").then(function(l){ lock = l; }).catch(function(){});
    }
  }
  document.addEventListener("visibilitychange", keepAwake);
  document.addEventListener("click", function once(){ keepAwake(); document.removeEventListener("click", once); });

  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }

  buildGrid(); render();
})();
</script>
</body>
</html>
